name: Compila APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Manifest
        run: |
          python3 -c '
          p = "and" + "roid"
          xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:{p}="http://schemas.{p}.com/apk/res/{p}">
              <application {p}:allowBackup="true" {p}:label="Lettore Manga" {p}:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity {p}:name=".MainActivity" {p}:exported="true">
                      <intent-filter>
                          <action {p}:name="{p}.intent.action.MAIN" />
                          <category {p}:name="{p}.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(xml)
          '
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LettoreManga-APK
          path: app/build/outputs/apk/debug/app-debug.apk
